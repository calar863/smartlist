<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SmartList</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app">
    <div class="header header--between">
      <div>
        <h1>SmartList</h1>
        <p id="saudacao">Organize suas compras facilmente</p>
      </div>
      <button type="button" class="logout-btn" onclick="sair()">Sair</button>
    </div>
    <div class="content">
      <div id="erro" class="error-msg"></div>

      <form id="form-nova-lista" style="margin-bottom:20px;">
        <div class="field">
          <input type="text" id="nome-lista" placeholder="Nome da nova lista (ex.: Compras do mês)">
        </div>
        <button type="submit" class="btn btn-primary">+ Criar Nova Lista</button>
      </form>

      <p class="section-title">Histórico</p>
      <div id="historico"><div class="card card-empty">Carregando...</div></div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/listas.js"></script>
  <script>
    const sessao = exigirLogin();
    document.getElementById("saudacao").textContent = "Olá, " + sessao.nome + "!";

    async function renderHistorico() {
      const container = document.getElementById("historico");
      const erroBox = document.getElementById("erro");

      const resultado = await getListsByUser(sessao.id);
      if (!resultado.ok) {
        erroBox.textContent = resultado.erro;
        erroBox.classList.add("show");
        container.innerHTML = "";
        return;
      }
      erroBox.classList.remove("show");
      const listas = resultado.listas;

      if (listas.length === 0) {
        container.innerHTML = '<div class="card card-empty">Nenhuma lista criada ainda<br><span class="muted">Crie sua primeira lista de compras!</span></div>';
        return;
      }

      container.innerHTML = listas
        .map((lista) => {
          const p = progressoLista(lista);
          const data = new Date(lista.dataCriacao).toLocaleString("pt-BR");
          return `
            <div class="history-item">
              <a href="lista.html?id=${lista.id}">
                <strong>${escapeHtml(lista.nome)}</strong>
                <div class="muted">${lista.itens.length} itens &middot; ${data}</div>
                <div class="muted">${p.concluidos} de ${p.total} completo &middot; ${p.percentual}%</div>
                <div class="progress-bar"><div class="progress-bar-fill" style="width:${p.percentual}%"></div></div>
              </a>
              <button class="history-delete" title="Excluir lista" onclick="onExcluir(${lista.id})">🗑</button>
            </div>`;
        })
        .join("");
    }

    async function onExcluir(listId) {
      if (!confirm("Excluir esta lista e todos os seus itens?")) return;

      const resultado = await excluirLista(listId);
      if (!resultado.ok) {
        const erroBox = document.getElementById("erro");
        erroBox.textContent = resultado.erro;
        erroBox.classList.add("show");
        return;
      }
      await renderHistorico();
    }

    document.getElementById("form-nova-lista").addEventListener("submit", protegerEnvio(async function (e) {
      e.preventDefault();
      const nomeInput = document.getElementById("nome-lista");
      const erroBox = document.getElementById("erro");

      const resultado = await criarLista(nomeInput.value, sessao.id);
      if (!resultado.ok) {
        erroBox.textContent = resultado.erro;
        erroBox.classList.add("show");
        return;
      }

      erroBox.classList.remove("show");
      nomeInput.value = "";
      window.location.href = "lista.html?id=" + resultado.lista.id;
    }));

    renderHistorico();
  </script>
</body>
</html>
