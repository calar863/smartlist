<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SmartList - Login</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app">
    <div class="header">
      <h1>Bem-vindo!</h1>
      <p>Faça login para continuar</p>
    </div>
    <div class="content">
      <div id="erro" class="error-msg"></div>
      <form id="form-login">
        <div class="field">
          <label for="email">E-mail</label>
          <input type="email" id="email" placeholder="seu@email.com" required>
        </div>
        <div class="field">
          <label for="senha">Senha</label>
          <input type="password" id="senha" placeholder="********" required>
        </div>
        <button type="submit" class="btn btn-primary">Entrar com E-mail</button>
      </form>
      <p class="link-row">Não tem uma conta? <a href="cadastro.html">Criar conta</a></p>
    </div>
  </div>

  <script src="js/auth.js"></script>
  <script>
    document.getElementById("form-login").addEventListener("submit", function (e) {
      e.preventDefault();
      const email = document.getElementById("email").value.trim();
      const senha = document.getElementById("senha").value;
      const erroBox = document.getElementById("erro");

      const resultado = realizarLogin(email, senha);
      if (!resultado.ok) {
        erroBox.textContent = resultado.erro;
        erroBox.classList.add("show");
        return;
      }

      erroBox.classList.remove("show");
      window.location.href = "home.html";
    });
  </script>
</body>
</html>
