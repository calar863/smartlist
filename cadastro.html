<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SmartList - Criar Conta</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app">
    <div class="header header--compact">
      <a href="index.html" class="back-link">&larr;</a>
      <div>
        <h1 style="font-size:20px;">Criar Conta</h1>
      </div>
    </div>
    <div class="content">
      <div id="erro" class="error-msg"></div>
      <form id="form-cadastro">
        <div class="field">
          <label for="nome">Nome</label>
          <input type="text" id="nome" placeholder="Seu nome completo" required>
        </div>
        <div class="field">
          <label for="email">E-mail</label>
          <input type="email" id="email" placeholder="seu@email.com" required>
        </div>
        <div class="field">
          <label for="senha">Senha</label>
          <input type="password" id="senha" placeholder="Mínimo 8 caracteres, letras e números" required>
        </div>
        <button type="submit" class="btn btn-primary">Criar Conta</button>
      </form>
      <p class="link-row">Já tem uma conta? <a href="index.html">Fazer login</a></p>
    </div>
  </div>

  <script src="js/auth.js"></script>
  <script>
    document.getElementById("form-cadastro").addEventListener("submit", function (e) {
      e.preventDefault();
      const nome = document.getElementById("nome").value.trim();
      const email = document.getElementById("email").value.trim();
      const senha = document.getElementById("senha").value;
      const erroBox = document.getElementById("erro");

      const resultado = cadastrarUsuario(nome, email, senha);
      if (!resultado.ok) {
        erroBox.textContent = resultado.erro;
        erroBox.classList.add("show");
        return;
      }

      erroBox.classList.remove("show");
      window.location.href = "index.html";
    });
  </script>
</body>
</html>
